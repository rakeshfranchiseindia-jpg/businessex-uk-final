<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 160" role="img" aria-labelledby="title desc">
  <title id="title">BusinessX Beta</title>
  <desc id="desc">BusinessX wordmark with a blue X and a BETA badge</desc>
  <defs>
    <linearGradient id="xBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3FBF"/>
      <stop offset="1" stop-color="#2F6FE4"/>
    </linearGradient>
    <linearGradient id="xFront" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA9F5"/>
      <stop offset="0.55" stop-color="#2F8BEF"/>
      <stop offset="1" stop-color="#4DB5F7"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#3FA9F5"/>
    </linearGradient>
  </defs>

  <!-- Wordmark -->
  <text x="4" y="128" fill="#14244A" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-size="128" font-weight="800" letter-spacing="-3"
        textLength="556" lengthAdjust="spacingAndGlyphs">Business</text>

  <!-- X mark -->
  <g transform="translate(562 30)">
    <polygon points="0,0 40,0 116,98 76,98" fill="url(#xBack)"/>
    <polygon points="76,0 116,0 40,98 0,98" fill="url(#xFront)"/>
    <polygon points="58,26 70,41 58,57 46,41" fill="#1D4ED8" opacity="0.35"/>
  </g>

  <!-- BETA badge -->
  <g transform="translate(692 18)">
    <rect width="118" height="44" rx="22" fill="url(#badge)"/>
    <text x="59" y="31" text-anchor="middle" fill="#FFFFFF"
          font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-size="24" font-weight="800" letter-spacing="4">BETA</text>
  </g>
</svg>
